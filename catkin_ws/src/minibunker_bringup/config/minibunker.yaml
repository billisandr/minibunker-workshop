# ============================================================================
#  minibunker.yaml — the ONE master config for the MiniBunker station.
#
#  This is the only file a workshop host edits. Launch files load it into the
#  ROS parameter server (`<rosparam command="load"/>`), so every nested key
#  below becomes a slash-param the nodes read, e.g.  detector/backend.
#  The Streamlit UI live-tunes a subset of these over rosbridge.
#
#  See plan.md §5 for the full schema rationale.
# ============================================================================

platform: sim                 # sim | real  (selects the launch; informational here)

mission:
  # What the rover hunts. 'none' = no autonomous follow: behaviour yields /cmd_vel
  # to WASD teleop (see behavior/teleop + the UI pad). 'ball'/'cone' = autonomous
  # find-and-follow of that class. Re-read live, so the UI can switch it mid-run.
  follow_item: none           # none | ball | cone
  # Classes treated as obstacles to AVOID. The followed class is automatically
  # excluded from this set (a cone you are following is not also its own hazard).
  hazard_items: [cone]        # subset of detector class names; may be empty

# (Arena objects — ball, cones, fence — are all defined together at the BOTTOM
#  of this file under `arena:`. The Gazebo .world holds only ground+lighting.)

camera:
  source: gazebo              # gazebo | picamera | webcam | video:/abs/path.mp4 | synthetic
  v4l2_device: /dev/video0    # used when source falls back to V4L2 on the Pi
  width: 640
  height: 480
  fps: 30
  flip_horizontal: false

detector:
  backend: hsv                # hsv | cnn  (HSV works with zero training; CNN needs a model)
  cnn:
    weights: /home/rosuser/catkin_ws/src/minibunker_perception/models/minibunker_yolov8n.onnx
    runtime: onnxruntime      # onnxruntime | ultralytics | ncnn
    conf_threshold: 0.45
    iou_threshold: 0.50
    class_names: [green_ball, cone]
    input_size: 416
  hsv:                        # the v0 baseline, generalised to two colours
    green_ball:
      lower: [40, 70, 40]     # HSV lower bound (OpenCV H is 0-179)
      upper: [85, 255, 255]
      min_area: 800
      close_ksize: 5          # solid blob -> only a mild close to fill holes
      open_ksize: 5           # drop small speckle noise
    cone:
      lower: [5, 120, 90]     # orange
      upper: [25, 255, 255]
      min_area: 1200
      close_ksize: [61, 9]    # [height, width]: TALL+narrow close bridges the
                              # white/black bands between the cone's orange stripes
                              # into one full-cone blob (even up close) without
                              # merging adjacent cones side-by-side (see detector)
      open_ksize: 3

behavior:
  arm_on_start: false         # SAFETY: boot DISARMED (zero Twist until ARMed)
  rate_hz: 15.0
  search:
    scan_angular_speed: 0.5   # rad/s, rotate while searching
  approach:
    steer_gain: 0.8           # P-gain on NORMALISED image-x error (-1..1)
    forward_speed: 0.25       # m/s
    collect_bbox_frac: 0.45   # STOP distance: target bbox height / frame height at
                              # which the rover stops & "collects" (keep a minimum
                              # gap, ~0.5 m — calibrate the fraction per docs/ARENA.md)
  collect:                    # the collect -> pause -> random turn-away -> search cycle
    pause_sec: 5.0            # hold still at the collected item
    turn_speed: 0.9           # rad/s while turning to leave (clamped to limits)
    turn_sec_min: 2.5         # random turn duration -> random departure heading
    turn_sec_max: 4.0
    away_speed: 0.25          # m/s driving away after the turn
    away_sec_min: 1.5         # random drive-away duration
    away_sec_max: 3.0
  avoid:
    cone_danger_frac: 0.35    # cone bbox height fraction (low-centre) that triggers AVOID
    backoff_speed: -0.15      # m/s (reverse)
    turn_speed: 0.6           # rad/s away from the cone
  limits:
    max_linear: 0.4           # hard speed caps (m/s)
    max_angular: 1.0          # rad/s
    lost_frames: 15           # frames without a target before falling back to SEARCH
  teleop:                     # WASD pass-through, active only when mission/follow_item == none
    timeout_ms: 400           # stop if no /minibunker/teleop_cmd within this window (watchdog)
    publish_hz: 20.0          # rate the terminal teleop_node republishes intent (feeds watchdog)
    linear_speed: 0.25        # m/s commanded per forward/back key (clamped to limits above)
    angular_speed: 0.8        # rad/s commanded per turn key (clamped to limits above)

drive:
  cmd_vel_topic: /cmd_vel
  track_width: 0.4            # for twist->tracks mixing on the v0/HSV coder path

ui:
  bridge: rosbridge          # rosbridge | sharedfile
  rosbridge_port: 9090
  refresh_hz: 10

# ============================================================================
#  ARENA OBJECTS (sim only) — the SINGLE place every prop is defined. The Gazebo
#  .world holds only the ground plane, lighting and physics; arena_setup.py reads
#  this block and spawns each object (one at a time). Add/remove/move props here.
#
#  Per object:
#    enabled : spawn it (true) or skip (false)
#    type    : sphere | box | cylinder | cone_mesh | fence
#    pose    : [x, y]  or  [x, y, yaw]   (z is auto: the object rests on the floor)
#    static  : true = immovable (fence);  false = dynamic (rover can knock it)
#    color   : [r, g, b] 0..1  (visual; ignored by cone_mesh, which is textured)
#    mass    : kg                          (dynamic objects only)
#    mu      : ground friction             (lower = skids farther)
#    kp, kd  : contact spring + damper      (high kp = low sink; raise kd to stop
#                                            a stiff contact bouncing in place)
#  Size keys by type: sphere{radius} · box{size:[x,y,z]} · cylinder{radius,length}
#                     cone_mesh{scale}  · fence{span,height,thickness}
#  INERTIA is auto-computed from type+size+mass (always consistent). Only add
#  `inertia: [ixx, iyy, izz]` to an object to override it.
# ============================================================================
arena:
  objects:

    ore_ball:                 # the green "ore" target
      enabled: true
      type: sphere
      radius: 0.15
      pose: [2.6, 0.4]
      static: false
      color: [0.1, 0.9, 0.1]
      mass: 0.02              # very light -> rolls freely when nudged
      mu: 0.2                 # lowest friction of all objects
      kp: 10000
      kd: 1.0

    cone_1:                   # orange hazard cones (real construction-cone mesh)
      enabled: true
      type: cone_mesh
      scale: 3.0              # mesh scale (~0.45 m tall at scale 10)
      pose: [1.4, -0.9]
      static: false
      mass: 0.05
      mu: 0.1                 # skids when hit; resists a bit more than the ball
      kp: 10000               # stiff (low sink)…
      kd: 50                  # …with damping so it doesn't bob in place

    cone_2:
      enabled: true
      type: cone_mesh
      scale: 3.0
      pose: [2.0, 1.1]
      static: false
      mass: 0.05
      mu: 0.1
      kp: 10000
      kd: 50

    cone_3:
      enabled: true
      type: cone_mesh
      scale: 3.0
      pose: [3.2, -1.4]
      static: false
      mass: 0.05
      mu: 0.1
      kp: 10000
      kd: 50

    fence:                    # 4-wall boundary ring; off by default
      enabled: false
      type: fence
      span: 6.0               # inner span (m)
      height: 0.5
      thickness: 0.1
      pose: [0.0, 0.0]
      static: true
      color: [0.6, 0.45, 0.12]
